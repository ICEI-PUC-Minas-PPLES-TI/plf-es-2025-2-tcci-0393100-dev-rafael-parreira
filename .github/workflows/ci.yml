name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go) — testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Codigo/backend/go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  frontend:
    name: Frontend (React/TS) — typecheck, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
